upstream backends {
    least_conn;
    server backend-1:80;
    server backend-2:80;
}

server {
    listen 80 default_server;
    server_name _;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://backends;
    }
}
